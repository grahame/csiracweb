<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23faf9f6'/%3E%3Cg fill='%231c1c1c'%3E%3Ccircle cx='4' cy='4' r='1.4'/%3E%3Ccircle cx='8' cy='8' r='1.4'/%3E%3Ccircle cx='12' cy='4' r='1.4'/%3E%3Ccircle cx='4' cy='12' r='1.4'/%3E%3Ccircle cx='12' cy='12' r='1.4'/%3E%3C/g%3E%3C/svg%3E"
        />
        <title>CSIRAC Emulator</title>
        <meta
            name="description"
            content="A web emulator for CSIRAC, Australia's first computer, ported from John W. Spencer's CSIRACEM."
        />

        <!--
            What a link to this page looks like where it is posted. The image is
            the bank of monitor tubes with a real machine's store on them, drawn
            by the page's own code; tools/make-og.mjs makes it.

            The addresses are absolute because that is the only kind a scraper
            will take, and they are the base the site is built for; see the base
            in vite.config.ts.
        -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="CSIRAC Emulator" />
        <meta property="og:url" content="https://grahame.dev/csirac/" />
        <meta property="og:title" content="CSIRAC: Australia's first computer, in your browser" />
        <meta
            property="og:description"
            content="Run the 1949 machine and its original tapes, and write Interprogram, Australia's first programming language."
        />
        <meta property="og:image" content="https://grahame.dev/csirac/og.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="The CSIRAC logo above the console's six monitor tubes, showing the registers and store of a running machine in green on grey."
        />
        <meta name="twitter:card" content="summary_large_image" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
